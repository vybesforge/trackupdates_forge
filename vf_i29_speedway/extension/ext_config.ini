[INCLUDE]
INCLUDE = common/conditions.ini, common/materials_track.ini, common/custom_emissive.ini, common\grass_fx.ini, common/Benner900conditions.ini, common/materials_base.ini, common/conditions_blm.ini, common/all_conditions.ini,

[GRASS_FX]
GRASS_MATERIALS = google?, Berm?
OCCLUDING_MATERIALS = marsh_wood, rmbl, Concrete?, plank, vf_ruts   ; VR11: no GrassFX blades on the dirt-track ruts
SHAPE_SIZE = 3
MASK_MAIN_THRESHOLD = 0.8
MASK_RED_THRESHOLD = 0.02

[Material_Water]
Materials = water
Type = RIVER
UseNormalMapTwice = 1
UseAlphaFromDiffuse = 1
UseRecommendedTextures = 1

; --- Cut detection (I-29 Speedway project)
; Cut detection is driven by data/surfaces.ini (IS_VALID_TRACK + BLACK_FLAG_TIME>0), not by an ext_config section.
; See layout data/surfaces.ini and docs/CHANGES.md.

; --- VR5 (I-29 Speedway project): automatic drag-strip Christmas tree (zw_draglaunch.kn5, meshes drtree_*).
; Needs Custom Shaders Patch with track Lua scripts (0.1.79 or newer; 0.2.x recommended). Without CSP the bulbs stay dark.
[SCRIPT_DRAG_TREE]
SCRIPT = drag_tree.lua

; bulbs: keep exact emissive colour (no WeatherFX eye-adaptation dimming) and cast a little light at night
[SHADER_REPLACEMENT_DRAG_TREE_BULBS]
MESHES = drtree_prestage_W, drtree_prestage_E, drtree_stage_W, drtree_stage_E, drtree_amber1_W, drtree_amber1_E, drtree_amber2_W, drtree_amber2_E, drtree_amber3_W, drtree_amber3_E, drtree_green_W, drtree_green_E, drtree_red_W, drtree_red_E
FIXED_EMISSIVE = 1

[EXTRA_FX_EMISSIVE_DRAG_TREE]
MESHES = drtree_prestage_W, drtree_prestage_E, drtree_stage_W, drtree_stage_E, drtree_amber1_W, drtree_amber1_E, drtree_amber2_W, drtree_amber2_E, drtree_amber3_W, drtree_amber3_E, drtree_green_W, drtree_green_E, drtree_red_W, drtree_red_E
RANGE = 3

